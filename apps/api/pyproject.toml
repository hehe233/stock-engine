[project]
name = "stock-engine-api"
version = "0.2.0"
description = "A learning-first stock research workflow built with FastAPI and LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "langgraph>=1.0,<2",
    "akshare>=1.18,<2",
    "httpx>=0.28,<1",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langgraph-checkpoint-postgres>=3,<4",
    "lightgbm>=4.6,<5",
    "scikit-learn>=1.6,<2",
    "pyarrow>=19,<24",
    "duckdb>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

